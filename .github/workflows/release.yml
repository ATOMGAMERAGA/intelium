name: Build, Test, Release

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the built jars'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  INTELIUM_VERSION: "1.2.4"

jobs:
  build:
    name: Build & test ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc1.21.11
            java: '21'
            label: '1.21.11'
            jarname: 'Intelium-v1.2.4-1.21.11.jar'
          - target: mc26
            java: '25'
            label: '26.x'
            jarname: 'Intelium-v1.2.4-26.x.jar'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./${{ matrix.target }}/gradlew

      - name: Build & test (${{ matrix.label }})
        run: |
          ./${{ matrix.target }}/gradlew -p ${{ matrix.target }} clean build \
            -PinteliumVersion="${INTELIUM_VERSION}" \
            --no-daemon --stacktrace

      - name: Collect the mod jar
        run: |
          mkdir -p dist
          SRC=$(ls ${{ matrix.target }}/build/libs/intelium-*.jar | grep -v sources | head -1)
          echo "Built: $SRC"
          cp "$SRC" "dist/${{ matrix.jarname }}"
          ls -la dist/

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.target }}
          path: ${{ matrix.target }}/build/reports/tests/test/
          retention-days: 14

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: dist/${{ matrix.jarname }}
          retention-days: 90

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish from main or a version tag. Pushes to claude/** branches still
    # run the build job above (real-environment validation) but do NOT release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.INTELIUM_VERSION }}"
          name: "Intelium ${{ env.INTELIUM_VERSION }}"
          body: |
            ## Intelium ${{ env.INTELIUM_VERSION }}

            Two jars, one per Minecraft line. Download the one matching your version:

            | Jar | Minecraft | Java |
            |---|---|---|
            | `Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar` | 1.21.11 | 21 |
            | `Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar` | 26.1, 26.1.1, 26.1.2, 26.2 | 25 |

            Made by **ATOMLAND Studios** · <https://modrinth.com/mod/intelium-mod>

            ---

            ### Modrinth changelog (copy the block below)

            ````markdown
            ## English

            **"Stop re-loading my chunks" release** — this update fixes the long-standing annoyance where the adaptive (smart) chunk features made the mod visibly re-load all chunks every so often, and adds a new GPU saver. Supports Minecraft **1.21.11** and the **26.x** line (26.1 → 26.2, including the Vulkan renderer).

            ### Fixed — Adaptive Render Distance no longer re-loads chunks over and over
            Two separate causes, both fixed:

            - **Alt-tab chunk reloads.** Unfocusing the window used to drop the adaptive reduction entirely — which forced a full chunk re-load, and *another one* on refocus when the controller reduced again. The reduction is now **held** while the window is unfocused (and while a menu FPS cap or the A/B benchmark is running); only the measurement pauses.
            - **Up/down ping-pong.** Stepping the render distance back up triggers a chunk-graph rebuild whose build burst *itself* reads as low FPS — so the controller immediately stepped back down, then up again 10 seconds later, forever. Every swing was a visible "the mod is loading all chunks again" moment. The controller now ignores a short **settle window** after each upward step (its own rebuild is never mistaken for lag), and a recovery that fails puts the next attempt on an **exponential backoff** (2× → 8× longer wait). A recovery that sticks relaxes the backoff again.

            The result: the smart chunk-loading features now change the render distance only when it genuinely helps, and the world stops flickering through rebuild cycles — which is itself an FPS win, since every avoided rebuild is CPU/GPU time your frames keep.

            ### New — Disable Menu Background Blur (GPU Savers group)
            The gaussian blur behind menus re-filters the whole frame on every menu frame — real GPU cost on an iGPU whenever the pause screen, inventory or settings are open. The new **Disable Menu Background Blur** toggle (off by default) forces the blur to 0 while Intelium is active, and restores your own blur setting the moment you turn it off. Pairs perfectly with the Menu FPS Limit.

            All existing levers (chunk-worker tuning, fast chunk loading, the GPU Savers group, live render tweaks, background & menu FPS limits) are unchanged and still capture & restore your original settings — even across a restart.

            Two jars: `Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar` (Java 21) or `Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar` (Java 25). Full Türkçe and English localisation. Verified compatible with GPUTape, AsyncParticles, Dynamic FPS and FPS Reducer.

            ## Türkçe (Turkish)

            **"Chunk'larımı yeniden yükleyip durma" sürümü** — bu güncelleme, akıllı (uyarlanabilir) chunk özelliklerinin modun ikide bir tüm chunk'ları gözle görülür şekilde yeniden yüklemesine yol açan sorunu çözüyor ve yeni bir GPU tasarrufu ekliyor. Minecraft **1.21.11** ve **26.x** serisi (26.1 → 26.2, Vulkan dahil) desteklenir.

            ### Düzeltildi — Uyarlanabilir Görüş Mesafesi artık chunk'ları tekrar tekrar yüklemiyor
            İki ayrı neden vardı, ikisi de düzeltildi:

            - **Alt-tab chunk yeniden yüklemeleri.** Pencere odağı kaybolduğunda uyarlanabilir azaltım tamamen sıfırlanıyordu — bu tam bir chunk yeniden yüklemesine, odak geri geldiğinde denetleyici tekrar düşürdüğü için *bir tane daha* yüklemeye zorluyordu. Artık pencere odaksızken (ve menü FPS sınırı ya da A/B testi çalışırken) azaltım **korunuyor**; yalnızca ölçüm duraklıyor.
            - **Aşağı/yukarı ping-pong.** Görüş mesafesini yukarı adımlamak chunk grafiğinin yeniden inşasını tetikler ve bu inşa patlaması *kendisi* düşük FPS gibi okunur — denetleyici hemen tekrar aşağı iniyor, 10 saniye sonra tekrar yukarı çıkıyordu; sonsuza dek. Her salınım gözle görülür bir "mod yine tüm chunk'ları yüklüyor" anıydı. Denetleyici artık her yukarı adımdan sonra kısa bir **oturma penceresini** yok sayıyor (kendi tetiklediği inşa asla gecikme sanılmıyor) ve tutmayan bir toparlanma, bir sonraki denemeyi **üstel geri çekilmeye** (2× → 8× daha uzun bekleme) alıyor. Tutan bir toparlanma geri çekilmeyi tekrar gevşetiyor.

            Sonuç: akıllı chunk yükleme özellikleri görüş mesafesini artık yalnızca gerçekten işe yaradığında değiştiriyor ve dünya yeniden inşa döngülerinde titremeyi bırakıyor — bu başlı başına bir FPS kazancı, çünkü önlenen her yeniden inşa karelerine kalan CPU/GPU zamanıdır.

            ### Yeni — Menü Arka Plan Bulanıklığını Kapat (GPU Tasarrufları grubu)
            Menülerin arkasındaki gaussian bulanıklık her menü karesinde tüm kareyi yeniden filtreler — duraklatma ekranı, envanter veya ayarlar açıkken iGPU'da gerçek GPU maliyeti. Yeni **Menü Arka Plan Bulanıklığını Kapat** seçeneği (varsayılan kapalı) Intelium etkinken bulanıklığı 0'a zorlar ve kapattığın an kendi bulanıklık ayarını geri yükler. Menü FPS Sınırı ile mükemmel uyum sağlar.

            Var olan tüm kollar (chunk-worker ayarı, hızlı chunk yükleme, GPU Tasarrufları grubu, canlı render ayarları, arka plan ve menü FPS sınırları) değişmedi ve orijinal ayarlarını yakalayıp geri yüklemeye devam ediyor — yeniden başlatmalarda bile.

            İki jar: `Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar` (Java 21) ya da `Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar` (Java 25). Tam Türkçe ve İngilizce yerelleştirme. GPUTape, AsyncParticles, Dynamic FPS ve FPS Reducer ile uyumluluğu doğrulandı.
            ````
          files: |
            dist/Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar
            dist/Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
