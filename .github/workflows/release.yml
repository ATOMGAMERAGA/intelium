name: Build, Test, Release

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the built jars'
        required: false
        default: 'true'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  INTELIUM_VERSION: "1.2.6"

jobs:
  build:
    name: Build & test ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mc1.21.11
            java: '21'
            label: '1.21.11'
            jarname: 'Intelium-v1.2.6-1.21.11.jar'
          - target: mc26
            java: '25'
            label: '26.x'
            jarname: 'Intelium-v1.2.6-26.x.jar'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./${{ matrix.target }}/gradlew

      - name: Build & test (${{ matrix.label }})
        run: |
          ./${{ matrix.target }}/gradlew -p ${{ matrix.target }} clean build \
            -PinteliumVersion="${INTELIUM_VERSION}" \
            --no-daemon --stacktrace

      - name: Collect the mod jar
        run: |
          mkdir -p dist
          SRC=$(ls ${{ matrix.target }}/build/libs/intelium-*.jar | grep -v sources | head -1)
          echo "Built: $SRC"
          cp "$SRC" "dist/${{ matrix.jarname }}"
          ls -la dist/

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.target }}
          path: ${{ matrix.target }}/build/reports/tests/test/
          retention-days: 14

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.target }}
          path: dist/${{ matrix.jarname }}
          retention-days: 90

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    # Only publish from main or a version tag. Pushes to claude/** branches still
    # run the build job above (real-environment validation) but do NOT release.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all jar artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jar-*
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -la dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.INTELIUM_VERSION }}"
          name: "Intelium ${{ env.INTELIUM_VERSION }}"
          body: |
            ## Intelium ${{ env.INTELIUM_VERSION }}

            Two jars, one per Minecraft line. Download the one matching your version:

            | Jar | Minecraft | Java |
            |---|---|---|
            | `Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar` | 1.21.11 | 21 |
            | `Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar` | 26.1, 26.1.1, 26.1.2, 26.2 | 25 |

            Made by **ATOMLAND Studios** · <https://modrinth.com/mod/intelium-mod>

            ---

            ### Modrinth changelog (copy the block below)

            ````markdown
            ## English

            **The Render Budget Engine release.** Until now Intelium made the game faster by flipping vanilla settings for you, well. This update adds three optimizations of our own that live *inside* the render path, and each one removes work the game was doing for nothing. Not one of them is a switch you could have flipped in the vanilla menu. Supports Minecraft **1.21.11** and the **26.x** line (26.1 → 26.2, including the Vulkan renderer).

            ### New — Smart Entity Culling
            Vanilla's "Entity Distance" is a single multiplier applied to everything alike: a dropped item and an ender dragon disappear at the same range. But what costs you frames is draw calls for things you cannot see, and whether you can see something depends on how big it lands **on your screen** — its real size over its distance, scaled by your field of view and your resolution.

            So Intelium culls by apparent size. For every entity it works out how many pixels tall it actually covers, and skips the ones below a threshold (Light 6 px, Balanced 12 px, Aggressive 24 px). At 1080p and 70° FOV on Balanced that means a dropped item or an XP orb stops drawing past ~16 blocks — where it was three pixels of noise — while a zombie keeps drawing past 100. Small-and-far is exactly the population that is numerous and worthless to draw, and it is the only population this touches. Nothing within 12 blocks is ever culled, and players and name-tagged entities are always drawn.

            ### New — Block Entity Budget
            Chests, signs, banners, beds, skulls and shulker boxes are the one part of the world Sodium cannot bake into the chunk mesh: each is walked and drawn on its own, every single frame. An open field has none of them. A storage room has six hundred — which is why the frame rate falls off a cliff in exactly the base you spent a month building. Intelium caps how many are drawn per frame (Light 512, Balanced 256, Aggressive 128) and drops the ones far enough away to be a smudge. An ordinary scene has a few dozen and never comes near the ceiling.

            ### New — Particle Burst Limiter
            Ordinary play spawns a handful of particles a tick and never notices this. A TNT chain or a splash-potion volley spawns thousands in a single tick, and every one of them then costs CPU to tick and GPU to draw for its whole lifetime — which is why the frame rate stays down for seconds *after* the bang, not just during it. Intelium caps new spawns per tick (Light 1024, Balanced 512, Aggressive 256). The explosion still looks like an explosion; the freeze that used to follow it stops happening.

            ### New — Adaptive Budgets
            All three tighten further when your frame rate falls short of the Adaptive FPS Target, and relax again the moment it recovers — at worst doubling the culling threshold and halving the budgets. While you are holding your target they change nothing at all.

            ### Defaults, and where to find it
            The engine ships **on**, at **Balanced**, because Balanced is tuned to remove only what you were not going to see anyway. Every system has its own Off / Light / Balanced / Aggressive setting under Sodium's video settings → Intelium → **Render Budget Engine**, and the master switch stands all three down instantly.

            Nothing else changed: chunk-worker tuning, fast chunk loading, the GPU Savers group, the live render tweaks, adaptive render distance and the background & menu FPS limits all behave exactly as they did, and still capture and restore your own settings across a restart. As always, if a future Minecraft moves one of the methods a hook attaches to, that one budget disables itself with a line in the log instead of crashing the game.

            Two jars: `Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar` (Java 21) or `Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar` (Java 25). Full Türkçe and English localisation. Verified compatible with GPUTape, AsyncParticles, Dynamic FPS and FPS Reducer.

            ## Türkçe (Turkish)

            **Render Bütçe Motoru sürümü.** Intelium şimdiye kadar oyunu, vanilya ayarlarını senin yerine iyi biçimde değiştirerek hızlandırıyordu. Bu güncelleme, doğrudan render hattının *içinde* çalışan, kendi geliştirdiğimiz üç optimizasyon ekliyor; her biri oyunun boşuna yaptığı işi ortadan kaldırıyor. Hiçbiri vanilya menüsünden kendin açabileceğin bir seçenek değil. Minecraft **1.21.11** ve **26.x** serisi (26.1 → 26.2, Vulkan dahil) desteklenir.

            ### Yeni — Akıllı Varlık Eleme
            Vanilya'nın "Varlık Mesafesi" ayarı her şeye aynı çarpanı uygular: yere düşmüş bir eşya ile ender ejderhası aynı mesafede kaybolur. Oysa sana kare kaybettiren şey, göremediğin şeyler için yapılan çizim çağrılarıdır ve bir şeyi görüp göremediğini, onun **ekranında** ne kadar yer kapladığı belirler — gerçek boyutunun mesafesine oranı, görüş açın ve çözünürlüğünle ölçeklenmiş hâli.

            Bu yüzden Intelium görünen boyuta göre eler. Her varlık için ekranda gerçekte kaç piksel yükseldiğini hesaplar ve eşiğin altında kalanları atlar (Hafif 6 px, Dengeli 12 px, Agresif 24 px). 1080p ve 70° görüş açısında Dengeli seviyede bu şu demek: yere düşmüş bir eşya ya da tecrübe küresi ~16 bloktan sonra — zaten üç piksellik bir lekeyken — çizilmeyi bırakır, bir zombi ise 100 bloğun ötesinde bile çizilmeye devam eder. Küçük ve uzak olanlar, tam olarak hem çok sayıda olan hem de çizilmeye değmeyen gruptur; bu özelliğin dokunduğu tek grup da odur. 12 blok içindeki hiçbir şey asla elenmez; oyuncular ve isim etiketli varlıklar her zaman çizilir.

            ### Yeni — Blok Varlığı Bütçesi
            Sandıklar, tabelalar, sancaklar, yataklar, kafalar ve shulker kutuları, dünyanın Sodium'un chunk örgüsüne katamadığı tek parçasıdır: her biri her karede tek tek gezilip çizilir. Açık arazide hiç yoktur. Bir depo odasında altı yüz tane vardır — bir ay uğraşıp yaptığın üssünde FPS'in tam da bu yüzden yerle bir olur. Intelium kare başına kaçının çizileceğini sınırlar (Hafif 512, Dengeli 256, Agresif 128) ve leke olacak kadar uzaktakileri eler. Sıradan bir sahnede birkaç düzine vardır ve tavana hiç yaklaşmaz.

            ### Yeni — Parçacık Patlaması Sınırlayıcı
            Sıradan oyunda tick başına bir avuç parçacık doğar ve bunu hiç fark etmezsin. Bir TNT zinciri ya da iksir yağmuru tek bir tick'te binlercesini doğurur ve her biri ömrü boyunca tick için CPU, çizim için GPU harcar — patlamadan *sonra* da FPS'in saniyelerce düşük kalmasının sebebi budur, patlama anında değil. Intelium tick başına yeni doğumları sınırlar (Hafif 1024, Dengeli 512, Agresif 256). Patlama yine patlama gibi görünür; ardından gelen donma ise artık yaşanmaz.

            ### Yeni — Uyarlanabilir Bütçeler
            Kare hızın Uyarlanabilir FPS Hedefi'nin altında kaldığında üçü de daha da sıkılaşır, hedef geri tutturulduğu an tekrar gevşer — en kötü durumda eleme eşiği iki katına, bütçeler yarıya iner. Hedefini tutturduğun sürece hiçbir şeyi değiştirmezler.

            ### Varsayılanlar ve nerede bulunur
            Motor **açık** ve **Dengeli** olarak gelir; çünkü Dengeli seviye, yalnızca zaten göremeyeceğin şeyleri kaldıracak biçimde ayarlandı. Her sistemin kendi Kapalı / Hafif / Dengeli / Agresif ayarı Sodium'un video ayarları → Intelium → **Render Bütçe Motoru** altında; ana anahtar ise üçünü birden anında durdurur.

            Başka hiçbir şey değişmedi: chunk-worker ayarı, hızlı chunk yükleme, GPU Tasarrufları grubu, canlı render ayarları, uyarlanabilir görüş mesafesi ve arka plan & menü FPS sınırları tam olarak eskisi gibi çalışıyor ve kendi ayarlarını yeniden başlatmalarda bile yakalayıp geri yüklemeye devam ediyor. Her zamanki gibi: ileride bir Minecraft sürümü kancaların bağlandığı bir metodu taşırsa, o bütçe oyunu çökertmek yerine günlüğe bir satır yazıp kendini kapatır.

            İki jar: `Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar` (Java 21) ya da `Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar` (Java 25). Tam Türkçe ve İngilizce yerelleştirme. GPUTape, AsyncParticles, Dynamic FPS ve FPS Reducer ile uyumluluğu doğrulandı.
            ````
          files: |
            dist/Intelium-v${{ env.INTELIUM_VERSION }}-1.21.11.jar
            dist/Intelium-v${{ env.INTELIUM_VERSION }}-26.x.jar
          draft: false
          prerelease: false
          generate_release_notes: false
          fail_on_unmatched_files: true
