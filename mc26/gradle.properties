# Done with Gradle 9.4+
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version = 1.3.4
maven_group = com.intelium
archive_base_name = intelium

# Minecraft / Fabric versions (26.2)
# Built against 26.2, whose default renderer is OpenGL (Vulkan is the
# experimental opt-in). The jar compiles directly against 26.2 class and method
# names, so fabric.mod.json declares 26.2 only - see the note there.
minecraft_version = 26.2
loader_version = 0.19.3

# 26.x is UNOBFUSCATED - no Yarn mappings line (the new net.fabricmc.fabric-loom
# plugin does not remap Minecraft).

# Fabric API for 26.2
fabric_version = 0.158.0+26.2

# Sodium target (Modrinth coordinate). Resolved artifact reports 0.9.1+mc26.2.
sodium_version = mc26.2-0.9.1-fabric
